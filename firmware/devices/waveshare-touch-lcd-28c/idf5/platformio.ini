; waveshare-touch-lcd-28c on arduino-esp32 3.x / ESP-IDF 5 (pioarduino), with an RGB bounce
; buffer of 10 lines as in Waveshare's own demo: the fallback if the picture of
; the main build (../platformio.ini, arduino-esp32 2.0.17) drifts or tears.
; The same sources (../src) and settings, plus ROUND_BOUNCE_PX, and the pixel
; clock at 16 MHz as on the 2.1″ (57 frames a second): each bounce buffer
; refill (below) gets an eighth more time than at 18 MHz.
;
;   pio run -d firmware/devices/waveshare-touch-lcd-28c/idf5 -e idf5 -t upload
;   pio run -d firmware/devices/waveshare-touch-lcd-28c/idf5 -e idf5-selftest -t upload
;   pio run -d firmware/devices/waveshare-touch-lcd-28c/idf5 -e idf5-bench -t upload   (frame times, no deck)
;
; pioarduino and PlatformIO's own espressif32 platform share package names
; (framework-arduinoespressif32) and clash in one PlatformIO home, so this
; project keeps its platform and toolchains in a home of its own.
[platformio]
src_dir = ../src
core_dir = ~/.platformio-pioarduino
default_envs = idf5

[env:idf5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Wi-Fi to the deck needs TLS 1.3 (the deck's network listener accepts nothing
; else), which the prebuilt arduino-esp32 libraries leave out: pioarduino
; rebuilds them with it (its first build takes a while longer). TLS takes its
; buffers from PSRAM: internal RAM (the drawing strip, the bounce buffers) is
; too short for a handshake.
;
; The RGB panel scans the framebuffer in PSRAM through two bounce buffers of
; ten lines, which the LCD interrupt refills in turn. Flash access (NVS, Wi-Fi)
; stopped the cache, and with it that interrupt; a refill held up longer than
; a buffer takes to scan folds two into one, and with RESTART_IN_VSYNC (on in
; the prebuilt libraries) the driver never recounts which buffer is which:
; every refill after that lands in the buffer being scanned, the picture
; shifted down with lines on one side until a reset. So the code runs from
; PSRAM (flash access no longer stops the cache) and the interrupt from IRAM:
; refills are never late. Should one be, the driver now counts each frame's
; refills and restarts the scan at the next VSYNC. PSRAM is read in 64-byte
; cache lines.
custom_sdkconfig =
    CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    '# CONFIG_LCD_RGB_RESTART_IN_VSYNC is not set'
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DPANEL_MAX_AGENTS=64
    -DPANEL_OPTION_LABEL=96
    -DROUND_ROTATION=0
    -DROUND_PCLK_HZ=16000000
    -DROUND_BOUNCE_PX=4800
build_src_flags = -Wall -Wextra
; Arduino_GFX 1.5.0 doesn't build on arduino-esp32 3.3 (its hardware SPI
; buses); 1.6 does. Only its software SPI (the ST7701's init) is used here:
; the RGB panel is esp_lcd's (panel-core/src/waveshare_round.h).
lib_deps =
    symlink://../../../deck-link
    symlink://../../../panel-core
    moononournation/GFX Library for Arduino@1.6.9

[env:idf5-selftest]
extends = env:idf5
build_flags = ${env:idf5.build_flags} -DROUND_SELFTEST

; The firmware with a line per touch, gesture and 5 s status on the USB port (the deck ignores text).
[env:idf5-debug]
extends = env:idf5
build_flags = ${env:idf5.build_flags} -DPANEL_DEBUG

; Without Deck Link: a made-up fleet on the spring, turned by itself, with frame times on the USB port.
[env:idf5-bench]
extends = env:idf5
build_flags = ${env:idf5.build_flags} -DROUND_BENCH -DSPRING_PROFILE
